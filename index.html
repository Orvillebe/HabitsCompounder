<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="stage">
  <div class="phone" id="app">

    <div class="page" id="page-working" data-name="working">
      <div id="working-content" class="scroll-area"></div>
    </div>

    <div class="page" id="page-balances" data-name="balances">
      <div id="balances-content" class="scroll-area"></div>
    </div>

    <div class="page" id="page-settings" data-name="settings">
      <div id="settings-content" class="scroll-area"></div>
    </div>

    <nav class="navbar">
      <a href="#working" data-page="working" aria-label="Today">
        <svg viewBox="0 0 24 24"><polyline points="4 12 9 17 20 6"/></svg>
        <span>Today</span>
      </a>
      <a href="#balances" data-page="balances" aria-label="Earned">
        <svg viewBox="0 0 24 24"><rect x="4" y="14" width="16" height="3" rx="0.5"/><rect x="6" y="10" width="12" height="3" rx="0.5"/><rect x="8" y="6" width="8" height="3" rx="0.5"/></svg>
        <span>Earned</span>
      </a>
      <a href="#settings" data-page="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </a>
    </nav>

    <div class="sheet-overlay" id="sheet-overlay"></div>
    <div class="sheet" id="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-content" id="sheet-content"></div>
    </div>

    <div class="toast" id="toast"></div>

  </div>
</div>

<script type="module" src="js/main.js"></script>

</body>
</html>
